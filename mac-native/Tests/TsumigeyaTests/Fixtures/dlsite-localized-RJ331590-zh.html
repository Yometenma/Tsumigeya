是利用丰满肉体进行诱惑并采取性方面的支配?\u003Cbr \u002F>\r\n抑或是屈服于接二连三的性骚扰，使她的自尊崩毁呢......!?\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n「卡琳监狱」是\u003Cbr \u002F>\r\n(1)充满多样性的独立战斗系统\u003Cbr \u002F>\r\n(2)模拟要素强烈的监狱管理系统\u003Cbr \u002F>\r\n(3)以轮奸为主轴的复数人\u003Cbr \u002F>\r\n完整结合以上3点的色情RPG。\u003Cbr \u002F>\r\nH情节全发生于战斗，没有文字叙事小说类的要素。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n透过发出各种指令来管理・经营监狱。\u003Cbr \u002F>\r\n卡琳的性爱可透过操作「意志力」「性欲」来发展。\u003Cbr \u002F>\r\n而且累积经验便能增加许多被动能力，卡琳会渐渐变得更加淫乱。\u003Cbr \u002F>\r\n",{"url":444,"alt":194,"title":194},"\u002F\u002Fimg.dlsite.jp\u002Fmodpub\u002Fimages2\u002Fparts\u002FRJ332000\u002FRJ331590\u002Fdbe0173e5c4966b9173b0b8f959bfc4b.jpg","over",{"type":438,"title":447,"body":448},"色情游戏专家拿出真本事制作的史上最强色情游戏",[449],{"intro":450,"image_info":451,"position":445},"追求著至今未曾出现过的全新色情游戏的色情游戏探求者才会推荐色情游戏。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n游戏开始时卡琳自信满满。相反地实际上是毫无性经验的处女。\u003Cbr \u002F>\r\n连第一次都没有的时候就突然被他人毫不在乎地疯狂侵犯......并没有那种事情。\u003Cbr \u002F>\r\n在回忆房间中看那些自己想看的情景! ......那也办不到。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n那种色情游戏我也知道很棒。超喜欢的。\u003Cbr \u002F>\r\n但是「卡琳监狱」所追求的色情游戏形象，是跟那些色情游戏完全不同的东西。\u003Cbr \u002F>\r\n",{"url":452,"alt":194,"title":194},"\u002F\u002Fimg.dlsite.jp\u002Fmodpub\u002Fimages2\u002Fparts\u002FRJ332000\u002FRJ331590\u002Fa2462a61d08a897dfaa017e93f04c520.jpg",{"type":438,"title":454,"body":455},"「卡琳监狱」越玩就变得越色情!!那理由会是?",[456],{"intro":457,"image_info":458,"position":445},"主角卡琳会根据战斗行动来累积各种经验。\u003Cbr \u002F>\r\n那些每一个都会确实地影响性需求及价值观，逐渐塑造出最后的卡琳模样。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n也不用不停选择防御和待机来等著敌人发动性骚扰攻击。\u003Cbr \u002F>\r\n想看H的话，首先就直接游玩就好。\u003Cbr \u002F>\r\n别想太多就照感觉玩。那样便能体验到不少兴奋感。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n要诀就是不要触发完全胜利。\u003Cbr \u002F>\r\n就算突然进入坏结局造成游戏结束也没关系。第一次玩总会这样的吧?\u003Cbr \u002F>\r\n对于「卡琳监狱」来说那些也在预料内，反而会是能更深入享受游戏的要因哦。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n (以单纯胜利为目的的确会使难度上升令人难受，但那也是享受游戏的方式之一)\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n这游戏所有事物都有尝试的价值。充满寻找&amp;获得的喜悦。\u003Cbr \u002F>\r\n失败和挑战会变成找到新发现的奖励。\u003Cbr \u002F>\r\n很快习惯游戏的你，就会自然地专精于「卡琳监狱」的攻克法上。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n到那时候恐怕已经是色情无双的开端。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n在特定时机尝试故意败北......\u003Cbr \u002F>\r\n在特定条件下故意造成游戏结束......\u003Cbr \u002F>\r\n那些所有有所意图的行动都会为游戏带来新鲜的兴奋连锁。\u003Cbr \u002F>\r\n",{"url":459,"alt":194,"title":194},"\u002F\u002Fimg.dlsite.jp\u002Fmodpub\u002Fimages2\u002Fparts\u002FRJ332000\u002FRJ331590\u002Fe2e493ece63f39dba3d32d998a89bbdc.jpg",{"type":438,"title":461,"body":462},"色情度加倍的开始新游戏+(plus)",[463],{"intro":464,"image_info":465,"position":445},"「卡琳监狱」采用了无论触发好结局还是坏结局都能继承该存档再次开始新游戏的「开始新游戏+」的系统。\u003Cbr \u002F>\r\n透过不断重新来过，不仅是主角卡琳，连身为玩家的自己也能学习到教训。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nNPC的台词也不只是单纯的文字。\u003Cbr \u002F>\r\n其中散落了使游戏进行得更有利的重要说明或提示。\u003Cbr \u002F>\r\n无视那些只碰色情部分进行探索可说是非常可惜的玩法。\u003Cbr \u002F>\r\n善用得到的知识和经验，便能经常得到全新发现。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n用正统色情游戏相同的方式去玩的话并不会有其他游戏常有的发展，可能会令人马上想认定为粪作。\u003Cbr \u002F>\r\n在「卡琳监狱」中，适当空出几个回合让敌人行动只会造成时间上的浪费。\u003Cbr \u002F>\r\n在追求『逐渐变色情的过程』的这游戏中，只是推进剧情便会触发色情事件...的事情也不会有。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n但是请安心吧。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n只要反复游玩不断学习，无论是谁都能判断是否真的能空出回合。\u003Cbr \u002F>\r\n游玩时间会直接变为成果回报给玩家的便是「卡琳监狱]。\u003Cbr \u002F>\r\n也许一开始要理解游戏系统多少会感到棘手。\u003Cbr \u002F>\r\n但是之后随著加深理解，便会涌起想尝试各种事物的欲求。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n透过开始新游戏+来反复重置，尝试新的选择......\u003Cbr \u002F>\r\n「卡琳监狱」就是能彻底回应那种玩家需求的游戏。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n当完全理解游戏时，曾经身为菁英皇帝秘书的卡琳早已不存在。\u003Cbr \u002F>\r\n她会反映出你的喜好，并培育出会采取行动的优秀性奴隶吧。\u003Cbr \u002F>\r\n",{"url":466,"alt":194,"title":194},"\u002F\u002Fimg.dlsite.jp\u002Fmodpub\u002Fimages2\u002Fparts\u002FRJ332000\u002FRJ331590\u002Fb244b844a32e73eb69340f323ae8af47.jpg",{"type":438,"title":468,"body":469},"越是发掘便得到越多的超过400种以上的色情特化被动能力!",[470],{"intro":471,"image_info":472,"position":445},"「卡琳监狱」中更有特征的就是丰富的能力值和和它相关的数值。\u003Cbr \u002F>\r\n发生在卡琳身上的事情、战斗、性体验，那些全部都会造成整体上的影响。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n给予指令后行动范围便会一口气扩展。\u003Cbr \u002F>\r\n行动范围大了，能得到的被动能力有会大量增加。\u003Cbr \u002F>\r\n然后那些将会改变卡琳的性爱，也会改变对于男人们的反应。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n被动能力也是卡琳的成长纪录，一切都会去点缀卡琳的心情。\u003Cbr \u002F>\r\n只是看著那些累积的被动能力，也会带来强烈的兴奋感也说不定。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n「卡琳监狱」是为了满足热情的色情游戏玩家下面和内心，由两位热情的色情游戏粉丝投注堪称固执的热情，仔细开发出的色情游戏!\u003Cbr \u002F>\r\n色情的部分不光是CG图片及系统结构。\u003Cbr \u002F>\r\n文字间充满内涵，引人遐想出各种妄想的故事，充满个性的角色们......。\u003Cbr \u002F>\r\n一切毫无妥协并持续开发的独立色情游戏的真正顶点就在于「卡琳监狱」!\u003Cbr \u002F>\r\n",{"url":473,"alt":194,"title":194},"\u002F\u002Fimg.dlsite.jp\u002Fmodpub\u002Fimages2\u002Fparts\u002FRJ332000\u002FRJ331590\u002F4f6285765c78f76767a810186e08c09c.jpg",{"type":438,"title":475,"body":476},"主角卡琳",[477],{"intro":478,"image_info":479,"position":481},"札那多斯帝国皇帝的专属秘书。\u003Cbr \u002F>\r\n她虽然靠著出众的身体能力及清晰的头脑一口气登上帝国顶尖地位，但有天受命去以狱卒长身分在充满男人的监狱「要塞加南」工作。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n不仅自己能力连外貌都很有自信，因此自尊非常高傲，将皇帝以外的男人全部加以鄙视。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n相对地不善于人情世故，有著容易受人影响摆布的一面。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n■CV\u003Cbr \u002F>\r\n・手冢りょうこ (日语)\u003Cbr \u002F>\r\n・SilkyMilk (英语)\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n语音和文字可以分开设定日语\u002F英语，最适合用来学习语言。\u003Cbr \u002F>\r\n※仅战斗中有完全配音\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n■难度设定\u003Cbr \u002F>\r\n・秘书模式:\u003Cbr \u002F>\r\n　适合给想先好好欣赏剧情及结局的玩家，最简单的难度。\u003Cbr \u002F>\r\n・狱卒模式:\u003Cbr \u002F>\r\n　第一次玩的话就先从这开始吧。\u003Cbr \u002F>\r\n・囚犯模式:\u003Cbr \u002F>\r\n　让卡琳不断败北，在H方面上登峰造极的人用的老手模式。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n■游戏操作\u003Cbr \u002F>\r\n支援键盘、滑鼠、游戏手把。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n■游玩时间\u003Cbr \u002F>\r\n第一次游玩约10～30小时以上。\u003Cbr \u002F>\r\n若包含取得所有结局、及为取得所有称号的限制性玩法则需100～200小时以上。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n■制作工具\u003Cbr \u002F>\r\nRPGツクールMV\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n■注意事项\u003Cbr \u002F>\r\n较旧的电脑或低配备的笔记型电脑可能造成运作过慢产生游玩障碍。\u003Cbr \u002F>\r\n・请在游玩前尽可能关闭其他浏览器及程式。\u003Cbr \u002F>\r\n・若有防毒软体请将此游戏列入白名单。\u003Cbr \u002F>\r\n・请先透过试玩版来确认游戏运作。\u003Cbr \u002F>\r\n・游戏可透过「nw.exe」来启动。\u003Cbr \u002F>\r\n・无法启动的话请下载DirectX( \u003Ca href=\"https:\u002F\u002Fwww.microsoft.com\u002Fzh-TW\u002Fdownload\u002
