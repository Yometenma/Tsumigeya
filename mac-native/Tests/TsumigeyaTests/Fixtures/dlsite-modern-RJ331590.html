{"genre_key":466,"genre_name":467,"url":468,"is_display":26},"honyakucoupon","【割引クーポン対象】翻訳作品一覧","https:\u002F\u002Fwww.dlsite.com\u002Fmaniax\u002Fgenres\u002Fworks?genrekey=honyakucoupon",[470,479,486,493,500,507],{"type":471,"title":472,"body":473},"image","巨乳看守カリンが完全制圧を目指すのは、暴動が勃発した問題だらけの監獄要塞!",[474],{"intro":475,"image_info":476,"position":478},"武術の達人でもあるカリンが取る手段は武力行使?\u003Cbr \u002F>\r\nそれとも豊満なボディで誘惑して性的に支配?\u003Cbr \u002F>\r\nはたまたセクハラに次ぐセクハラに屈服し、彼女のプライドは崩れ去ってしまうのか……?!\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n「カリンズ・プリズン」は、\u003Cbr \u002F>\r\n(1)多様性に富んだ独自のバトルシステム\u003Cbr \u002F>\r\n(2)シミュレーション要素の強い監獄管理システム\u003Cbr \u002F>\r\n(3)輪○メインの複数人とのセックス\u003Cbr \u002F>\r\nこの3つが完全に融合したエロRPGです。\u003Cbr \u002F>\r\nHシーンは全て戦闘で発生し、ビジュアルノベルの要素はありません。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n様々な「指令」を出すことで監獄を管理・運営していきます。\u003Cbr \u002F>\r\nカリンのセックスは「意志力」と「性欲」を操作して発展させることが出来ます。\u003Cbr \u002F>\r\n更に経験を積めばどんどんパッシブが増え、カリンは徐々に淫乱へと変わっていきます。",{"url":477,"alt":220,"title":220},"\u002F\u002Fimg.dlsite.jp\u002Fmodpub\u002Fimages2\u002Fparts\u002FRJ332000\u002FRJ331590\u002F97623731957f9e51e74aedb15b6386e8.jpg","over",{"type":471,"title":480,"body":481},"エロゲマニアが本気で作った史上最強のエロゲ",[482],{"intro":483,"image_info":484,"position":478},"今までにない新しいエロゲを求めるエロゲ探求者にこそオススメのエロゲです。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nスタート時のカリンは自信に満ちた性格。それに反して、実は性経験ゼロの処女。\u003Cbr \u002F>\r\n初体験もない内からいきなり誰彼構わずハメまくる……なんてことはありません。\u003Cbr \u002F>\r\n回想部屋でお気に入りのシーンだけ閲覧!ということも出来ません。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nそういったエロゲが素晴らしいのは重々承知です。大好きです。\u003Cbr \u002F>\r\nしかし「カリンズ・プリズン」が追い求めたエロゲ像は、それらとは全く違う物なのです。",{"url":485,"alt":220,"title":220},"\u002F\u002Fimg.dlsite.jp\u002Fmodpub\u002Fimages2\u002Fparts\u002FRJ332000\u002FRJ331590\u002F627326bfe90f9e5a1c88a6e6ebb1589b.jpg",{"type":471,"title":487,"body":488},"「カリンズ・プリズン」はやればやるほど後からエロくなる!!その理由とは?",[489],{"intro":490,"image_info":491,"position":478},"主人公のカリンは戦闘の行動によって様々な経験を積むことが出来ます。\u003Cbr \u002F>\r\nその1つ1つが着実に性的欲求や価値観に影響し、最終的なカリンの姿を形作っていくのです。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n敵からのセクハラを期待して防御や待機を繰り返す必要はありません。\u003Cbr \u002F>\r\nHを見たい場合、まずは普通にプレイするだけでいいのです。\u003Cbr \u002F>\r\n頭を悩ませずとも感じたままに進めてみましょう。それだけで多くの興奮を体験出来ます。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nコツは完全勝利を目指さないことです。\u003Cbr \u002F>\r\nいきなりバッドエンドでゲームオーバーになっても大丈夫。初見プレイならよくあることですよね?\u003Cbr \u002F>\r\n「カリンズ・プリズン」にとってそれは想定内で、むしろより深くゲームを楽しめる要因です。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n(単純な勝利を目的にすると難易度が上がってキツイのは確かですが、それも楽しみ方の1つです)\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nこのゲームではあらゆることを試す価値があります。探す喜びがあります。\u003Cbr \u002F>\r\n失敗と挑戦が新たな発見につながるご褒美となります。\u003Cbr \u002F>\r\n次第にゲームに慣れたあなたは、「カリンズ・プリズン」の攻略法を自然とマスターしていきます。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nそこからはもはやエロ無双の始まりです。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n狙ったタイミングであえて敗北してみたり……\u003Cbr \u002F>\r\n特定の条件下であえてゲームオーバーに持ち込んだり……\u003Cbr \u002F>\r\nそんな、意図的にとる行動全てが新鮮な興奮へと連鎖していくゲームです。",{"url":492,"alt":220,"title":220},"\u002F\u002Fimg.dlsite.jp\u002Fmodpub\u002Fimages2\u002Fparts\u002FRJ332000\u002FRJ331590\u002F0a59fe689c987e80dc3c6094cf8c703e.jpg",{"type":471,"title":494,"body":495},"エロさを倍増させていくニューゲーム+(プラス)",[496],{"intro":497,"image_info":498,"position":478},"「カリンズ・プリズン」ではグッドエンド、バッドエンドどちらのエンディングでもデータを引き継いで再スタート出来る「ニューゲーム+」のシステムを採用しています。\u003Cbr \u002F>\r\n何度もやり直すことで主人公のカリンだけではなく、プレイヤーであるあなた自身も学んでいくことになります。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nNPCのセリフは単なるフレイバーテキストではありません。\u003Cbr \u002F>\r\nそこにはゲームを有利に進めるための、重要な説明やヒントが散りばめられています。\u003Cbr \u002F>\r\nこれらを無視してエロだけを模索するのは非常にもったいない遊び方です。\u003Cbr \u002F>\r\n得た知識と経験を最大限に活かせば、常に新しい発見があるからです。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nオーソドックスなエロゲと同じ感覚でプレイすると他のゲームにあるような展開にはならないので、即クソゲー認定をしたくなる可能性があります。\u003Cbr \u002F>\r\n「カリンズ・プリズン」において、適当にターンを稼いで敵を泳がせるような行動は時間の無駄になります。\u003Cbr \u002F>\r\n『エロくなる過程』を追求したこのゲームでは、物語を進めるだけでエロイベントが発生する……なんてことありません。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nしかしご安心下さい。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n繰り返しプレイして学びを深めれば、本当にターンを稼ぐべきか否かの判断が誰でも出来るようになります。\u003Cbr \u002F>\r\nプレイ時間がそのまま結果として報われるのが「カリンズ・プリズン」です。\u003Cbr \u002F>\r\n最初はシステムを理解するのに多少手こずるかもしれません。\u003Cbr \u002F>\r\nしかしその後、理解が深まるにつれ、あれやこれやと試したくなる欲求が湧いてきます。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nニューゲーム+でリセットを繰り返し、様々な選択肢を試したい……\u003Cbr \u002F>\r\n「カリンズ・プリズン」はそんなユーザーに徹底的に応えてくれるゲームです。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nゲームを完全に理解したとき、エリートの皇帝秘書だったカリンはもういません。\u003Cbr \u002F>\r\n彼女はあなた好みに反応し、行動する立派な性奴○に育っていることでしょう。",{"url":499,"alt":220,"title":220},"\u002F\u002Fimg.dlsite.jp\u002Fmodpub\u002Fimages2\u002Fparts\u002FRJ332000\u002FRJ331590\u002F8e496176a344434856994ec09de5b9fe.jpg",{"type":471,"title":501,"body":502},"掘れば掘るほど出てくる400以上のエロ特化パッシブ!",[503],{"intro":504,"image_info":505,"position":478},"「カリンズ・プリズン」で更に特徴的なのが、豊富なステータスとそれにまつわる数値です。\u003Cbr \u002F>\r\nカリンに起きた出来事、戦闘、性体験、その全てが総合的に影響を与えます。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n指令を出せば行動範囲が一気に広がります。\u003Cbr \u002F>\r\n行動が広がれば、得られるパッシブも大量に増えていきます。\u003Cbr \u002F>\r\nそしてそれがカリンのセックスを変え、男たちへの反応も変えてしまうのです。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nパッシブはカリンの成長の記録でもあり、その全てにカリンの心情が綴られています。\u003Cbr \u002F>\r\nその蓄積されたパッシブリストを眺めるだけでも、強烈な興奮をもたらすかもしれません。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n「カリンズ・プリズン」は筋金入りのエロゲユーザーの股間と心を満たすため、筋金入りのエロゲファン2人がしつこいくらい情熱を詰め込んで、丁寧に開発したエロゲです!\u003Cbr \u002F>\r\nエロいのはCGやシステムの構成だけではありません。\u003Cbr \u002F>\r\n練りに練り込まれたテキスト、様々な妄想を掻き立てる物語、個性的なキャラクターたち……。\u003Cbr \u002F>\r\n一切の妥協なく開発を続けているインディーエロゲの真骨頂が「カリンズ・プリズン」に詰まっています!",{"url":506,"alt":220,"title":220},"\u002F\u002Fimg.dlsite.jp\u002Fmodpub\u002Fimages2\u002Fparts\u002FRJ332000\u002FRJ331590\u002F4f6285765c78f76767a810186e08c09c.jpg",{"type":471,"title":508,"body":509},"主人公 カリン",[510],{"intro":511,"image_info":512,"position":514},"ザナドス帝国皇帝の専属秘書。\u003Cbr \u002F>\r\n類まれなる身体能力と明晰な頭脳で一気に帝国のトップへ駆け上った才女だったが、ある日、男だらけの監獄「要塞ガナン」で看守長官として働くことになった。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n自身の能力だけでなく容姿にも自信があるため非常にプライドが高く、皇帝以外の男はすべて見下している。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nその反面義理や人情には弱く、流されやすい一面もある。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n■CV\u003Cbr \u002F>\r\n・手塚りょうこ (日本語)\u003Cbr \u002F>\r\n・SilkyMilk (英語)\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n声とテキストは日本語\u002F英語の組み合わせ可能ですので、語学学習にも最適です。\u003Cbr \u002F>\r\n※戦闘のみフルボイス\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n■難易度の設定\u003Cbr \u002F>\r\n・秘書モード:\u003Cbr \u002F>\r\n　まずは物語をじっくり見てエンディングを目指したい人向けの、最もやさしい難易度です。\u003Cbr \u002F>\r\n・看守モード:\u003Cbr \u002F>\r\n　初回プレイではまずここからやってみましょう。\u003Cbr \u002F>\r\n・囚人モード:\u003Cbr \u002F>\r\n　カリンを何度も敗北させ、より深いHを極めるための上級者用モードです。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n■ゲーム操作\u003Cbr \u002F>\r\nキーボード、マウス、ゲームパッドに対応しています。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n■プレイ時間\u003Cbr \u002F>\r\n初回プレイで10～30時間以上。\u003Cbr \u002F>\r\n全エンディング、全称号を得るための縛りプレイを含めると100～200時間以上。\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n■制作環境\u003Cbr \u002F>\r\nRPGツクールMV\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n■ご注意\u003Cbr \u002F>\r\n古いパソコンや低スペックのノートパソコンでは重すぎて動作に支障が出る場合があります。\u003Cbr \u002F>\r\n・なるべくブラウザや他のプログラムを閉じてからプレイして下さい。\u003Cbr \u002F>\r\n・アンチウィルスソフトがある場合は許可して下さい。\u003Cbr \u002F>\r\n・まずは体験版で動作確認をお願いいたします。\u003Cbr \u002F>\r\n・ゲームは「nw.exe」から起動出来ます。\u003Cbr \u002F>\r\n・起動出来ない場合はDirectXをダウンロードして下さい( \u003Ca href=\"https:\u002F\u002Fwww.microsoft.com\u002Fja-JP\u002Fdownload\u002Fdetails.aspx?id=8109\" target=\"_blank\">https:\u002F\u002Fwww.microsoft.com\u002Fja-JP\u002Fdownload\u002Fdetails.aspx?id=8109\u003C\u002Fa> )\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n※「カリンズ・プリズン」に登場するキャラクターは全て18歳以上です。",{"url":513,"alt":220,"title":220},"\u002F\u002Fimg.dlsite.jp\u002Fmodpub\u002Fimages2\u002Fparts\u002FRJ332000\u002FRJ331590\u002F865bcc20f0ee448cec01b7822a2131b4.jpg","left",[],[517,521,524,526,530,534,535,536,537,539],{"category":518,"period":519,"rank":212,"date":520},"all","day","2021-12-17",{"category":518,"period":522,"rank":212,"date":523},"week","2021-12-19",{"category":518,"period":525,"rank":212,"date":523},"month",{"category":518,"period":527,"rank":528,"date":529},"year",23,"2021",{"category":518,"period":531,"rank":532,"date":533},"total",31,"2022-09-29",{"category":269,"period":519,"rank":212,"date":520},{"category":269,"period":522,"rank":212,"date":523},{"category":269,"period":525,"rank":212,"date":523}
