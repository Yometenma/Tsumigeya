name: build

# 触发：手动 + 打 tag（v*）+ 主分支推送
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- 质量门
  # 所有平台共用：类型检查 + 单测 + 构建。失败就不进入打包。
  check:
    name: 检查（typecheck / test / build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 构建（不打包）
        run: npm run build

  # ---------------------------------------------------------------- macOS
  # dmg 只能在 macOS 上产出（electron-builder 无法交叉编译 dmg）。
  # arm64 与 x64 分别打，产物分开命名，避免用户下错架构。
  build-mac:
    name: 打包 macOS（${{ matrix.arch }}）
    needs: check
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建（打包前必须先产出 out/）
        run: npm run build

      - name: 打包 dmg
        # --publish never：禁止 electron-builder 自己上传。
        # 原因：在 tag 构建时它会自动尝试 publish，但 GITHUB_TOKEN 对「创建 draft release」
        # 的权限不足，且 arm64/x64 两个 job 会争抢同一个 release，实测直接 403 Forbidden。
        # 发布统一交给下面的 release job（softprops/action-gh-release）做。
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never --config electron-builder.yml
        env:
          # 未配置证书时走 ad-hoc 签名：能安装、能运行，但不做公证（首次打开需右键→打开）。
          # 想正式分发时在仓库 Secrets 里加 CSC_LINK / CSC_KEY_PASSWORD / APPLE_ID 等再调整这里。
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # 自检：dmg 里的布局必须与 src/main/core-host.ts 的 resolveCorePath 假设一致，
      # 否则装到 Mac 上会「能开窗口但引擎模块加载失败」，而且本地很难发现。
      # 注意：不要硬编码 dist/mac-<arch>/，electron-builder 的目录命名随平台/架构变化
      # （x64 可能是 mac/ 也可能是 mac-x64/），所以这里直接 find。
      - name: 自检 .app 内的关键文件
        run: |
          set -e
          echo "--- dist 顶层 ---"
          ls -1 dist
          APP=$(find dist -maxdepth 2 -name "Tsumigeya.app" -type d | head -1)
          test -n "$APP" || { echo "❌ 在 dist 里找不到 Tsumigeya.app"; exit 1; }
          echo "找到 app: $APP"
          echo "--- Contents/Resources 顶层 ---"
          ls -1 "$APP/Contents/Resources" | head -20
          test -f "$APP/Contents/Resources/core/module.js" \
            || { echo "❌ 缺少 Contents/Resources/core/module.js（extraResources 未生效）"; exit 1; }
          test -f "$APP/Contents/Resources/app.asar" \
            || { echo "❌ 缺少 app.asar"; exit 1; }
          echo "✅ core/module.js 就位：$(wc -c < "$APP/Contents/Resources/core/module.js") 字节"
          echo "✅ app.asar 就位：$(wc -c < "$APP/Contents/Resources/app.asar") 字节"
          echo "--- 签名状态 ---"
          # Apple Silicon 要求所有可执行文件至少被 ad-hoc 签名，
          # 否则 macOS 会直接报「已损坏」而不是「无法验证开发者」。
          # 这里显式校验，签名缺失或无效就让 job 失败，不产出打不开的包。
          codesign --verify --deep --strict "$APP" \
            || { echo "❌ 签名校验失败（app 未签名或签名无效，装到 Mac 会提示已损坏）"; exit 1; }
          echo "✅ 签名校验通过"
          codesign -dv "$APP" 2>&1 | grep -E "Signature|Identifier|TeamIdentifier" || true
      - name: 列出产物
        run: ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: Tsumigeya-macOS-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------- Windows
  # 调试 UI 用；不是交付目标，但能提前暴露 asar / extraResources 的问题。
  build-win:
    name: 打包 Windows（x64）
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建（打包前必须先产出 out/）
        run: npm run build

      - name: 打包安装包
        # 同 mac：禁止自动 publish，统一由 release job 上传（见上方说明）。
        run: npx electron-builder --win --x64 --publish never --config electron-builder.yml

      - name: 自检 win-unpacked 内的关键文件
        shell: pwsh
        run: |
          $app = "dist/win-unpacked"
          if (-not (Test-Path $app)) { Write-Error "找不到 $app"; exit 1 }
          $core = Join-Path $app "resources/core/module.js"
          if (-not (Test-Path $core)) { Write-Error "缺少 resources/core/module.js"; exit 1 }
          Write-Host "core/module.js 就位：$((Get-Item $core).Length) 字节"
      - name: 列出产物
        run: dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: Tsumigeya-Windows-x64
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------- 发布
  # 只在打 tag（v*）时把产物挂到 GitHub Release。日常提交只上传 artifact。
  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true
